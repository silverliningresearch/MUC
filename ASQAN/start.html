   <script type="text/javascript">
    // Configuration for fallback system
    const CONFIG_URL = 'https://raw.githubusercontent.com/silverliningresearch/aptgateway/main/config.json?t=' + new Date().getTime();
    let prj ="MUC_ASQA";
    
    // Global variables to store config and data sources
    let gatewayConfig = null;
    let dataSourceBase = '';
    let requiresToken = false;
    let userToken = '';
    let chartsReady = false;
    let dataReady = false;

    // Parse token from URL query parameter
    function getTokenFromURL() {
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      return urlParams.get('token') || '';
    }

    // Get token on page load
    userToken = getTokenFromURL();

    if (userToken) {
      console.log('Token found in URL');
    } else {
      console.log('No token in URL - will use fallback mode if token is required');
    }

    // Fetch configuration and load data scripts
    async function loadConfiguration() {
      try {
        const response = await fetch(CONFIG_URL);
        gatewayConfig = await response.json();

        // Determine data source based on mode
        if (gatewayConfig.mode === 'primary') {
          dataSourceBase = gatewayConfig.primary.url;
          requiresToken = gatewayConfig.primary.requiresToken;
        } else if (gatewayConfig.mode === 'fallback') {
          dataSourceBase = gatewayConfig.fallback.url;
          requiresToken = gatewayConfig.fallback.requiresToken;
        }

        // If token is required but not provided - warn
        if (requiresToken && !userToken) {
          console.warn('Token required but not provided.');
        }

        // Display current mode for debugging
        console.log(`Gateway Mode: ${gatewayConfig.mode}`);
        console.log(`Data Source: ${dataSourceBase}`);
        console.log(`Requires Token: ${requiresToken}`);

      } catch (error) {
        console.error('Error loading configuration:', error);
        alert('Failed to load gateway configuration. Application cannot start.');
        return; // Stop execution if config fails
      }

      // Load data scripts dynamically
      try {
        // Check for Mixed Content (HTTPS page loading HTTP content)
        if (window.location.protocol === 'https:' && dataSourceBase.startsWith('http:')) {
          const msg = 'Security Error: Cannot load insecure (HTTP) data from a secure (HTTPS) page. Please use HTTP or update the server to HTTPS.';
          console.error(msg);
          alert(msg);
          return;
        }

        await loadDataScripts();
      } catch (error) {
        console.error('Error loading data scripts:', error);
        alert(`Failed to load data scripts: ${error.message}\nPlease check your connection or token.`);
      }
    }

    // Load data scripts based on configuration
    async function loadDataScripts() {
      // Build URLs with or without token
      let interviewStatsUrl, flightListUrl, quotaAirlineDestUrl,  quotaAirlineUrl,  quotaDestUrl;
      let quotaDataUrl, invalidCasesUrl, quotaTimeOriginUrl, locationCountUrl;

      if (requiresToken && userToken) {
        // Primary server with token
        interviewStatsUrl = `${dataSourceBase}/${prj}/interview_statistics_asq.js?token=${userToken}`;
        quotaTimeOriginUrl = `${dataSourceBase}/${prj}/ASQ_Quota_Time_Origin.js?token=${userToken}`;
        locationCountUrl = `${dataSourceBase}/${prj}/location_count.js?token=${userToken}`;
      } else {
        // Fallback GitHub repository without token
        interviewStatsUrl = `${dataSourceBase}/${prj}/interview_statistics_asq.js`;
        quotaTimeOriginUrl = `${dataSourceBase}/${prj}/ASQ_Quota_Time_Origin.js`;
        locationCountUrl = `${dataSourceBase}/${prj}/location_count.js`;
      }

      // Load remote data scripts via fetch+eval to bypass MIME type restriction
      try {
        console.log('Loading script:', interviewStatsUrl);
        await fetchAndEval(interviewStatsUrl);
        await fetchAndEval(quotaTimeOriginUrl);
        await fetchAndEval(locationCountUrl);

        console.log('Remote data scripts loaded successfully');

      } catch (error) {
        console.error('Error loading remote data scripts:', error);
        throw error;
      }

      // Load logic scripts after data scripts are loaded
      try {
        await loadScript('scripts/CalculateData_ASQ.js');
        await loadScript('scripts/PrepareData_ASQ.js');
        console.log('Logic scripts loaded successfully');
      } catch (error) {
        console.error('Error loading logic scripts:', error);
        throw error;
      }

      // Signal that data is ready
      dataReady = true;
      console.log('Data ready');
      attemptDraw();
    }

    // Fetch a JS file as text and eval it (bypasses MIME type restriction from raw.githubusercontent.com)
    // Uses globalThis assignment to escape function scope (let/var inside a function eval are NOT global)
    function fetchAndEval(url) {
      return fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
          return response.text();
        })
        .then(code => {
          // Replace first `let/const/var varName` declaration with `globalThis.varName`
          // so the variable is accessible globally after eval
          const globalCode = code.replace(/^\s*(let|const|var)\s+(\w+)/, 'globalThis.$2');
          eval(globalCode);
        });
    }

    // Helper function to load a script dynamically (for local scripts)
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
        document.head.appendChild(script);
      });
    }

    function onChartsLoaded() {
      console.log('Google Charts loaded');
      chartsReady = true;
      attemptDraw();
    }

    function attemptDraw() {
      if (chartsReady && dataReady) {
        console.log('Both Charts and Data ready. Drawing table...');
        drawPlanTable();
        drawTerminalTable();
      } else {
        console.log(`Waiting... Charts: ${chartsReady}, Data: ${dataReady}`);
      }
    }

    // Start loading configuration when the page loads
    window.onload = loadConfiguration;
  </script>

  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    google.charts.load('current', {'packages':['table','corechart', 'controls']});
      google.charts.setOnLoadCallback(onChartsLoaded);

      function drawTerminalTable() {
        var data = new google.visualization.DataTable();
        data.addColumn('string', 'Terminal area');
        data.addColumn('string', 'Baggage belt');
        data.addColumn('string', 'Exit');
        data.addColumn('string', 'Landside');
        data.addColumn('number', 'Interviews');

        // counts per Location x Exit_belt for the current month, shown as row % (count / row total).
        var rows = CalculateLocationReport_asq();
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          data.addRows([[r.Location,
            percentText_asq(r["Baggage belts"], r.Interviews),
            percentText_asq(r.Exit, r.Interviews),
            percentText_asq(r.Landside, r.Interviews),
            r.Interviews]]);
        }
        data.addRows([["Soft target", "50%", "25%", "25%", null]]);

        // bold Total row, italic Soft target row
        for (var j = 0; j < data.getNumberOfColumns(); j++) {
          data.setProperty(rows.length - 1, j, 'style', 'font-weight:bold');
          data.setProperty(rows.length, j, 'style', 'font-style:italic');
        }

        var table = new google.visualization.Table(document.getElementById('terminal_table_div'));
        table.draw(data, {
          'allowHtml': true,
          'showRowNumber': false,
          'sort': 'disable',
          'cssClassNames': {
            'headerRow': 'table-font',
            'tableCell': 'table-font',
            'headerCell': 'googleHeaderCell',
          }
        });
      }

      function drawPlanTable() {
        CalculateAirportAirLineReport_asq();
        var data = new google.visualization.DataTable();

        data.addColumn('string', 'Date');
        data.addColumn('string', 'Time');
        data.addColumn('number', 'TER');
        data.addColumn('string', 'Origin Airport');
        data.addColumn('string', 'Flight');
        data.addColumn('string', 'Timeband');
        data.addColumn('number', 'Quota');
        data.addColumn('number', 'Completed');
        data.addColumn('number', 'Missing');
        data.addColumn('number', 'Completed %');
        data.addColumn('string', 'Quota Completed?');
        data.addColumn('number', 'Priority');

        for (i = 0; i < daily_plan_data_asq.length; i++) {
          var row = daily_plan_data_asq[i];

          var parts =  row.Time_of_Day_Origin.split("-");
          var timeband = parts[0];
          var origin = row.DestName;

          data.addRows([
          [
            row.DateID,
            row.Time,
            Number(row.TER),
            origin,
            row.Flight,
            timeband,
            Number(row.Quota),
            Number(row.Completed),
            Number(row.Difference),
            Number(row.Completed_percent),
            row.Quota_Completed,
            Number(row.Priority)
          ]
          ]);
        }

          //highlight priority one
        var priority_col = data.getNumberOfColumns()-1; //last one
        for (var i = 0; i < data.getNumberOfRows(); i++) {
          for (j=0; j < data.getNumberOfColumns(); j++) {
            if (data.getValue(i, priority_col) ==1) 
            {
              data.setProperty(i, j, 'style', 'background-color:#FFCCCB');
            }
            else if ( data.getValue(i, priority_col) ==2) 
            {
              data.setProperty(i, j, 'style', 'background-color:#F67052');
            }
          }
        }

        var dashboard = new google.visualization.Dashboard(
        document.getElementById('dashboardPlan_div'));

        // Date filter
        var filterDateOptions = {
          'filterColumnLabel': 'Date',
          "ui": {
                "label": '',
                "labelStacking": 'horizontal',
                "caption": "Select Date",
                }
        }
        var filterDate = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filterDate_div',
          'options': filterDateOptions
        });

        // Terminal filter
        var filterTerminalOptions = {
          'filterColumnLabel': 'TER',
          "ui": {
                "label": '',
                "labelStacking": 'horizontal',
                "caption": "Select Terminal",
                }
        }
        var filterTerminal = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filterTerminal_div',
          'options': filterTerminalOptions
        });

        // Origin filter
        var filterOriginOptions = {
          'filterColumnLabel': 'Origin Airport',
          "ui": {
                "label": '',
                "labelStacking": 'horizontal',
                "caption": "Select Origin",
                }
        }
        var filterOrigin = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filterOrigin_div',
          'options': filterOriginOptions
        });

        // Timeband filter
        var filterTimebandOptions = {
          'filterColumnLabel': 'Timeband',
          "ui": {
                "label": '',
                "labelStacking": 'horizontal',
                "caption": "Select Timeband",
                }
        }
        var filterTimeband = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filterTimeband_div',
          'options': filterTimebandOptions
        });

        // Quota Completed filter
        var filterCompletedOptions = {
          'filterColumnLabel': 'Quota Completed?',
          "ui": {
                "label": '',
                "labelStacking": 'horizontal',
                "caption": "Select Quota Completed?",
                }
        }
        var filterCompleted = new google.visualization.ControlWrapper({
          'controlType': 'CategoryFilter',
          'containerId': 'filterCompleted_div',
          'options': filterCompletedOptions,
          state: {
              selectedValues: ['No']
            }
        });

        // Table
        var tableChart = new google.visualization.ChartWrapper({
          'chartType': 'Table',
          'containerId': 'tablePlan_div',
          'options': {
            'allowHtml': true,
            'width': '100%',
            'height': '100%',
            'sort': 'disable',
            'showRowNumber': false,
            'cssClassNames': {
              'headerRow': 'table-font',
              'tableCell': 'table-font',
              'headerCell': 'googleHeaderCell',
            },
            // 'pageSize': 10,
            // 'page': 'enable',
            // 'pagingButtonsConfiguration': 'auto',
          }
        });

        dashboard.bind([filterDate, filterTerminal, filterOrigin, filterTimeband, filterCompleted], tableChart);

        var view = new google.visualization.DataView(data);
        view.setRows(data.getSortedRows([{column: 0}, {column: 1}]));
        view.hideColumns([priority_col]); // Hide the Priority column in the table view
        dashboard.draw(view);

        //today status
        var today_status = "<span class='badge'>1</span>ASQ Arrivals today (" + currentDate + "): Completed: " + total_completed_today_asq;
        // soft target
        if (total_completed_today_asq < 6) today_status += " <span class='chip low'>Below soft target of 6 to 18 per day</span>";
        else if (total_completed_today_asq > 18) today_status += " <span class='chip high'>Above soft target of 6 to 18 per day</span>";
        else today_status += " <span class='chip ok'>Within soft target of 6 to 18 per day</span>";
        document.getElementById("asq_today_status").innerHTML = today_status;

        //month status
        var month_status = "ASQ Arrivals month (" + currentMonth + "-" + currentYear + "): Quota: " + total_quota_month_asq;
        month_status += " - Completed: " + total_completed_month_asq;
        month_status += " (" + (100*total_completed_month_asq/total_quota_month_asq).toFixed(0) + "%)";
        month_status += " - Missing: " + Math.max(0, total_quota_month_asq - total_completed_month_asq);
        document.getElementById("asq_month_status").innerHTML = month_status;

        // registration check status
        CalculateLocationReport_asq();
        var reg_diff = total_completed_month_asq - total_registered_month_asq;
        var reg_share = total_completed_month_asq ? reg_diff / total_completed_month_asq : 0;
        var reg_diff_text = reg_diff + " (" + Math.round(reg_share * 100) + "%)";
        document.getElementById("register_status").innerHTML =
          "Registration check | Registered: " + total_registered_month_asq + " | Not registered yet: " +
          (reg_share > 0.03 ? "<span class='flag'>" + reg_diff_text + "</span>" : reg_diff_text) +
          " | Registration data updated at: " + registration_download_time_asq;

        //quarter status
        var quarter_status = "ASQ Arrivals quarter (" + currentQuarter + "): Quota: " + total_quota_asq;
        quarter_status += " - Completed: " + total_completed_asq;
        quarter_status += " (" + total_completed_percent_asq + "%)";
        quarter_status += " - Missing: " + Math.max(0, total_quota_asq - total_completed_asq);
        document.getElementById("asq_quarter_status").innerHTML = quarter_status;
        
        // live data status
        var data_status = "Live data from the ASQ Survey in the SMT tool | SMT data updated at: " + download_time_asq;
        document.getElementById("data_status").innerHTML = data_status;

        // terminal title
        var terminal_title = "<span class='badge'>2</span>Interview point by terminal area, " + currentMonth + "-" + currentYear + " (row %)";
        document.getElementById("terminal_title").innerHTML = terminal_title;

        // plan title
        var plan_title = "<span class='badge'>3</span>Sample plan, " + currentQuarter;
        document.getElementById("plan_title").innerHTML = plan_title;
      }
  </script>
